name: MPV embedded-player experiment

on:
  push:
    branches:
      - experiment/mpv-player
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mpv-smoke-test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out isolated MPV experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/mpv-player
      - name: Set up Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: x64
      - name: Download and prepare official LGPL libmpv
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'libmpv.zip'
          $url = 'https://github.com/mpv-player/mpv/releases/download/v0.42.0/libmpv-v0.42.0-x86_64-w64-mingw32-lgpl.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 180
          $extract = Join-Path $env:RUNNER_TEMP 'libmpv-extracted'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $target = Join-Path $env:GITHUB_WORKSPACE 'vendor\mpv'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $dlls = Get-ChildItem -Path $extract -Filter '*.dll' -Recurse
          if (!$dlls -or $dlls.Count -eq 0) { throw 'No DLLs were found in the libmpv archive.' }
          foreach ($dll in $dlls) { Copy-Item -LiteralPath $dll.FullName -Destination $target -Force }
          if (!(Test-Path (Join-Path $target 'libmpv-2.dll'))) { throw 'libmpv-2.dll was not found.' }
          $total = (Get-ChildItem $target -File | Measure-Object Length -Sum).Sum
          "MPV_DLL_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ("Bundled MPV DLL payload: {0:N2} MiB" -f ($total / 1MB))
          Get-ChildItem $target -File | Select-Object Name,Length | Format-Table -AutoSize
      - name: Download a small local MP4 test clip
        shell: pwsh
        run: |
          $video = Join-Path $env:RUNNER_TEMP 'mpv-test.mp4'
          Invoke-WebRequest -Uri 'https://download.samplelib.com/mp4/sample-5s.mp4' -OutFile $video -TimeoutSec 120
          if (!(Test-Path $video) -or (Get-Item $video).Length -lt 10000) { throw 'Test clip download failed or file is too small.' }
          "MPV_TEST_VIDEO=$video" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ("Downloaded test clip: {0:N2} MiB" -f ((Get-Item $video).Length / 1MB))
      - name: Test local embedded playback and controls
        shell: pwsh
        run: |
          python experiments\mpv_probe.py --local "$env:MPV_TEST_VIDEO"
          if ($LASTEXITCODE -ne 0) { throw 'MPV local embedded playback test failed.' }
      - name: Test direct HTTPS network playback
        shell: pwsh
        run: |
          python experiments\mpv_probe.py --network "https://download.samplelib.com/mp4/sample-5s.mp4"
          if ($LASTEXITCODE -ne 0) { throw 'MPV direct HTTPS playback test failed.' }
      - name: Test HLS network streaming
        shell: pwsh
        run: |
          python experiments\mpv_probe.py --network "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          if ($LASTEXITCODE -ne 0) { throw 'MPV HLS streaming test failed.' }
